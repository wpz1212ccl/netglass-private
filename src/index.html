<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>NetGlass</title>
<style>
  @font-face{
    font-family:"Inter";
    src:url("fonts/inter-var.woff2") format("woff2-variations");
    font-weight:100 900;font-style:normal;font-display:swap;
  }
  :root{
    --ink:#12151A;
    --s2:rgba(18,21,26,.64);
    --s3:rgba(18,21,26,.50);
    --accent:#0A84FF;
    --green:#34C759;
    --orange:#C46A00;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:transparent;overflow:hidden}
  body{
    font-family:"Inter","SF Pro Text","Segoe UI Variable Text","PingFang SC","Microsoft YaHei UI",sans-serif;
    -webkit-font-smoothing:antialiased;user-select:none;cursor:default;
    font-feature-settings:"cv05" 1,"cv11" 1;
  }
  /* 展开态 = 苹果式圆角矩形组件（iOS 小组件 / macOS 控制中心模块）。
     窗口形状完全由这里的 border-radius 决定：Chromium 会做逐像素抗锯齿，
     不要再用 Win32 区域裁剪窗口（1-bit 蒙版会把圆角切成台阶）。
     corner-shape 是 Chromium 的连续曲率圆角（真·苹果 squircle），
     老内核不认识这条声明，会自然回退到普通圆弧。 */
  .card{
    position:fixed;inset:0;border-radius:35px;corner-shape:squircle;overflow:hidden;
    background:linear-gradient(172deg,rgba(255,255,255,.36) 0%,rgba(252,253,255,.22) 46%,rgba(244,247,252,.26) 100%);
    box-shadow:
      0 18px 38px -22px rgba(18,28,48,.34),
      0 3px 10px -4px rgba(18,28,48,.10),
      inset 0 0 0 .5px rgba(255,255,255,.72),
      inset 0 .5px 0 rgba(255,255,255,.85);
    color:var(--ink);
    opacity:1;
    transform:translateY(0) scale(1);
    transform-origin:50% 50%;
    transition:
      opacity .24s cubic-bezier(.6,0,.25,1),
      transform .46s cubic-bezier(.6,0,.25,1),
      border-radius .5s cubic-bezier(.6,0,.25,1),
      background .34s cubic-bezier(.6,0,.25,1),
      box-shadow .34s cubic-bezier(.6,0,.25,1);
    will-change:transform,opacity;
  }
  .card::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(120% 90% at 18% -12%,rgba(255,255,255,.28),transparent 58%),
      radial-gradient(90% 70% at 100% 0%,rgba(255,255,255,.16),transparent 62%);
  }
  .card::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(70% 50% at 6% 108%,rgba(10,132,255,.045),transparent 62%),
      linear-gradient(180deg,transparent 72%,rgba(18,28,48,.035) 100%);
  }
  .card:hover{
    background:linear-gradient(172deg,rgba(255,255,255,.44) 0%,rgba(252,253,255,.28) 46%,rgba(244,247,252,.32) 100%);
  }
  /* 窗口就是卡片的边界：形状不能位移/缩放，否则会被窗口裁掉；
     悬停只让内容轻微上浮，形状靠背景亮度与详情错峰表达。 */
  .card:not(.nohover):hover .inner{transform:translateY(-1px)}

  .inner{position:absolute;inset:0;z-index:1;
         opacity:1;transform:translateY(0);
         transition:opacity .26s cubic-bezier(.6,0,.25,1) .06s,transform .56s cubic-bezier(.6,0,.25,1)}

  .top{position:absolute;left:22px;right:22px;top:18px;height:16px;
       display:flex;align-items:center;gap:6px}
  .glyph{width:13px;height:13px;flex:none;stroke:var(--s2);fill:none;
         stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .title{font-size:13px;font-weight:600;letter-spacing:-.012em;color:var(--ink);
         white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
  .top .spacer{flex:1}
  .state{font-size:11px;font-weight:450;color:rgba(18,21,26,.60);letter-spacing:.002em;white-space:nowrap}

  .main{position:absolute;left:22px;right:22px;top:56px;height:46px;
        display:flex;align-items:flex-end;justify-content:space-between}
  .down{display:flex;align-items:baseline;gap:5px}
  .num{font-size:46px;font-weight:600;line-height:46px;letter-spacing:-.042em;
       font-variant-numeric:tabular-nums}
  .unit{font-size:13px;font-weight:500;color:rgba(18,21,26,.60);letter-spacing:-.005em}
  .up{display:flex;align-items:baseline;gap:3px;padding-bottom:2px;
      font-size:14px;font-weight:560;color:var(--s2);font-variant-numeric:tabular-nums}
  .up svg{width:9px;height:9px;stroke:var(--s3);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .up .u2{font-size:11px;font-weight:500;color:var(--s3);margin-left:1px}

  .foot{
    position:absolute;left:22px;right:22px;top:120px;
    display:flex;align-items:center;gap:14px;
    font-size:11px;font-weight:500;color:var(--s2);letter-spacing:.004em;
    transition:opacity .1s ease .12s;
  }
  .foot .item{display:flex;align-items:center;gap:4px;white-space:nowrap}
  .foot svg{width:11px;height:11px;stroke:var(--s3);fill:none;stroke-width:1.8;
            stroke-linecap:round;stroke-linejoin:round;flex:none}
  .foot b{font-weight:600;color:var(--s2)}
  .foot b.warn{color:var(--orange)}
  .foot b.err{color:#FF3B30}
  .foot b.off{color:var(--s2);font-weight:500}

  .chart{position:absolute;left:22px;right:22px;bottom:0;height:56px;pointer-events:none;
         transition:opacity .24s cubic-bezier(.6,0,.25,1) .18s;
         -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 26px,#000 calc(100% - 26px),transparent 100%);
         mask-image:linear-gradient(90deg,transparent 0,#000 26px,#000 calc(100% - 26px),transparent 100%)}
  .chart svg{display:block;width:100%;height:100%}

  .details{
    position:absolute;left:22px;right:22px;top:106px;bottom:12px;
    display:grid;grid-template-columns:1fr 1fr;column-gap:26px;row-gap:0;
    align-content:space-between;
    opacity:0;transform:translateY(4px);pointer-events:none;
    transition:opacity .22s cubic-bezier(.6,0,.25,1) .06s,transform .4s cubic-bezier(.6,0,.25,1) .06s;
  }
  .card:not(.nohover):hover .details{opacity:1;transform:translateY(0)}
  /* 离开 hover：详情先退场，底栏与曲线延迟回来，避免两套文字同屏 */
  .card:not(:hover) .details{transition:opacity .1s ease 0s,transform .1s ease 0s}
  .card:not(.nohover):hover .foot{opacity:0;transition:opacity .07s ease 0s}
  .card:not(.nohover):hover .chart{opacity:0;transition:opacity .1s linear 0s}
  .card.nohover:hover{background:linear-gradient(172deg,rgba(255,255,255,.34) 0%,rgba(252,253,255,.20) 46%,rgba(244,247,252,.24) 100%)}
  .cell{display:flex;align-items:baseline;justify-content:space-between;padding:0;font-size:10.5px;
        opacity:0;transform:translateY(5px);
        transition:opacity .2s cubic-bezier(.6,0,.25,1),transform .42s cubic-bezier(.6,0,.25,1)}
  /* 详情逐行错峰进场，最后一行稍慢，形成"逐条展开"的节奏 */
  .card:not(.nohover):hover .cell{opacity:1;transform:none}
  .card:not(.nohover):hover .cell:nth-child(1){transition-delay:.04s}
  .card:not(.nohover):hover .cell:nth-child(2){transition-delay:.08s}
  .card:not(.nohover):hover .cell:nth-child(3){transition-delay:.12s}
  .card:not(.nohover):hover .cell:nth-child(4){transition-delay:.16s}
  .card:not(.nohover):hover .cell:nth-child(5){transition-delay:.2s}
  .card:not(:hover) .cell{transition-delay:0s}
  .cell.span2{grid-column:span 2;border-top:.5px solid rgba(18,21,26,.075);padding-top:9px;margin-top:3px}
  .cell span:first-child{color:rgba(18,21,26,.64);font-weight:450}
  .cell span:last-child{color:var(--s2);font-weight:550;font-variant-numeric:tabular-nums;letter-spacing:-.005em}
  /* 胶囊内容与卡片内容常驻 DOM，用 opacity/visibility 交叉淡入；
     形变期间两者都被 .morphing 压到 0，中间帧只有形状、没有文字。 */
  .mini{position:absolute;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;gap:5px;
        color:var(--ink);opacity:0;visibility:hidden;pointer-events:none;transform:scale(1);
        transition:opacity .26s cubic-bezier(.6,0,.25,1) .04s,visibility 0s linear .3s,transform .46s cubic-bezier(.34,1.5,.64,1)}
  .card.collapsed .mini{opacity:1;visibility:visible;pointer-events:auto;
        transform:scale(1);
        transition:opacity .26s cubic-bezier(.6,0,.25,1) .06s,visibility 0s,transform .46s cubic-bezier(.34,1.5,.64,1)}
  .card.collapsed:active .pillbg{filter:brightness(.965)}

  /* 胶囊底与卡片同一套玻璃材质（同透明度），只把色相往中性灰压一档，
     两者挨着时能区分开。灰色由 filter 微调，避免渐变硬切。 */
  .pillbg{position:absolute;inset:0;z-index:0;pointer-events:none;
          background:
            radial-gradient(120% 90% at 18% -12%,rgba(255,255,255,.28),transparent 58%),
            radial-gradient(90% 70% at 100% 0%,rgba(255,255,255,.16),transparent 62%),
            linear-gradient(172deg,rgba(243,245,248,.36) 0%,rgba(230,233,239,.22) 46%,rgba(221,225,232,.26) 100%);
          opacity:0;transition:opacity .4s cubic-bezier(.6,0,.25,1),filter .32s cubic-bezier(.6,0,.25,1)}
  .card.collapsed .pillbg{opacity:1}
  .card.collapsed.hot .pillbg{filter:brightness(1.05)}

  /* 灵动岛：与卡片同材质的玻璃胶囊 + 墨色文字，贴着屏幕顶端。
     形状仍是 CSS 圆角（胶囊 = 高度一半），抗锯齿由 Chromium 负责。 */
  .card.collapsed{
    border-radius:21px;corner-shape:round;cursor:pointer;
    transition:
      opacity .24s cubic-bezier(.6,0,.25,1),
      border-radius .5s cubic-bezier(.6,0,.25,1),
      background .34s cubic-bezier(.6,0,.25,1),
      box-shadow .34s cubic-bezier(.6,0,.25,1);
    box-shadow:
      inset 0 0 0 .5px rgba(255,255,255,.72),
      inset 0 .5px 0 rgba(255,255,255,.85);
  }
  .card.collapsed::before{background:none}
  .card.collapsed::after{display:none}
  .card.collapsed .inner{opacity:0;visibility:hidden;pointer-events:none;
        transition:opacity .14s ease,visibility 0s linear .14s,transform .3s cubic-bezier(.4,0,.6,1)}
  .card.collapsed .chart{opacity:0}
  .mdot{width:6px;height:6px;border-radius:50%;background:#34C759;flex:none;
        box-shadow:0 0 5px rgba(52,199,89,.35)}
  #mDown{font-size:15px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--ink)}
  #mUnit{font-size:10px;font-style:normal;color:rgba(18,21,26,.60)}
  .mup{font-size:10px;color:rgba(18,21,26,.55);font-variant-numeric:tabular-nums}
  .mup i{font-style:normal}

  /* 形变中：所有文字退场，只留下正在变化的圆角形状。
     !important 用于压过 .collapsed 的 visibility 规则，保证淡出可见。 */
  .card.morphing{transform:none!important;transition:none!important;contain:layout paint style;
        box-shadow:inset 0 0 0 .5px rgba(255,255,255,.55)!important;
        background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(246,248,252,.24))!important}
  .card.morphing::before,.card.morphing::after{display:none!important}
  .card.morphing .inner{visibility:visible!important;opacity:0!important;transform:translateY(6px)!important;
        transition:opacity .12s cubic-bezier(.6,0,.4,1),transform .24s ease}
  .card.morphing .mini{visibility:visible!important;opacity:0!important;transform:scale(.96)!important;
        transition:opacity .12s cubic-bezier(.6,0,.4,1),transform .24s ease}
  .card.morphing .chart{opacity:0!important;transition:opacity .12s linear}
  .card.morphing .mini{pointer-events:none!important}

  /* 出现 / 消失：Rust 先发 net-leave，等这段淡出画完再隐藏；
     显示时移除 .out 淡入。展开态和胶囊共用同一套曲线。 */
  .card.out{
    opacity:0;transform:translateY(6px) scale(.962);
    transition:opacity .2s cubic-bezier(.6,0,.25,1),transform .32s cubic-bezier(.6,0,.25,1);
  }
  .card.collapsed.out{transform:translateY(3px) scale(.94)}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="pillbg"></div>
  <div class="mini">
    <span class="mdot"></span>
    <b id="mDown">—</b><i id="mUnit">MB/s</i>
    <span class="mup">↑ <i id="mUp">—</i></span>
  </div>

  <div class="inner">
    <div class="top">
      <svg class="glyph" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.6"/><path d="M2.4 8h11.2"/><path d="M8 2.4c2.9 3.2 2.9 8 0 11.2-2.9-3.2-2.9-8 0-11.2Z"/></svg>
      <span class="title" id="title">正在读取</span>
      <span class="spacer"></span>
      <span class="state" id="state">—</span>
    </div>

    <div class="main">
      <div class="down">
        <span class="num" id="down">—</span>
        <span class="unit" id="unit">MB/s</span>
      </div>
      <div class="up">
        <svg viewBox="0 0 12 12"><path d="M6 9.6V3"/><path d="M3.2 5.6 6 2.8l2.8 2.8"/></svg>
        <span id="up">—</span>
        <span class="u2" id="upUnit">MB/s</span>
      </div>
    </div>

    <div class="foot" id="foot">
      <span class="item">
        <svg viewBox="0 0 16 16"><path d="M2 6.2a9 9 0 0 1 12 0"/><path d="M4.4 8.7a5.4 5.4 0 0 1 7.2 0"/><circle cx="8" cy="11.9" r=".9" fill="currentColor" stroke="none"/><path d="m2.6 13.4 10.8-10.8" stroke-width="1.5"/></svg>
        Wi-Fi <b class="off" id="wifi">—</b>
      </span>
      <span class="item">
        <svg viewBox="0 0 16 16"><path d="M8.9 1.9 4.4 8.9h3l-.7 5.2 4.9-7.4H8.4z" stroke-linejoin="round"/></svg>
        代理 <b class="warn" id="proxy">未启用</b>
      </span>
    </div>

    <div class="details">
      <div class="cell"><span>延迟</span><span id="latency">—</span></div>
      <div class="cell"><span>峰值</span><span id="peak">—</span></div>
      <div class="cell"><span>链路</span><span id="link">—</span></div>
      <div class="cell"><span>上行峰值</span><span id="peakUp">—</span></div>
      <div class="cell span2"><span>代理</span><span id="proxy2" style="color:#C46A00">未启用</span></div>
    </div>
  </div>

  <div class="chart">
    <svg id="spark" viewBox="0 0 320 66" preserveAspectRatio="none">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#0A84FF" stop-opacity=".30"/>
          <stop offset="55%" stop-color="#0A84FF" stop-opacity=".09"/>
          <stop offset="100%" stop-color="#0A84FF" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="s" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#0A84FF" stop-opacity=".35"/>
          <stop offset="70%" stop-color="#0A84FF" stop-opacity="1"/>
          <stop offset="100%" stop-color="#0066D6" stop-opacity="1"/>
        </linearGradient>
      </defs>
      <path id="base" fill="none" stroke="rgba(18,21,26,.10)" stroke-width=".6" d="M0,57.6 L320,57.6" opacity="0"/>
      <path id="area" fill="url(#g)"/>
      <path id="line" fill="none" stroke="url(#s)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
</div>

<script>
(() => {
  const N = 60, W = 320, H = 66;
  const hist = new Array(N).fill(0);
  const upHist = new Array(N).fill(0);

  const el = {
    title: document.getElementById('title'),
    state: document.getElementById('state'),
    down: document.getElementById('down'),
    unit: document.getElementById('unit'),
    up: document.getElementById('up'),
    upUnit: document.getElementById('upUnit'),
    wifi: document.getElementById('wifi'),
    proxy: document.getElementById('proxy'),
    peak: document.getElementById('peak'),
    peakUp: document.getElementById('peakUp'),
    link: document.getElementById('link'),
    latency: document.getElementById('latency'),
    proxy2: document.getElementById('proxy2'),
    area: document.getElementById('area'),
    line: document.getElementById('line'),
    base: document.getElementById('base'),
    mDown: document.getElementById('mDown'),
    mUnit: document.getElementById('mUnit'),
    mUp: document.getElementById('mUp'),
  };

  class Spring {
    constructor(v) { this.x = v; this.v = 0; this.t = v; }
    step(dt) {
      const k = 175, c = 21;
      this.v += (-k * (this.x - this.t) - c * this.v) * dt;
      this.x += this.v * dt;
      return this.x;
    }
  }
  const sDown = new Spring(0);
  const sUp = new Spring(0);
  let unit = 'MB/s';

  function fmt(v) {
    if (!isFinite(v) || v < 1024) return ['0.0', 'MB/s'];
    const mb = v / 1048576;
    if (unit === 'MB/s') { if (mb < 0.95) unit = 'KB/s'; }
    else if (mb > 1.05) unit = 'MB/s';
    if (unit === 'MB/s') return [mb.toFixed(1), 'MB/s'];
    return [String(Math.round(v / 1024)), 'KB/s'];
  }

  // 上行/峰值不做单位迟滞，避免出现"↑ 0.0 MB/s 而峰值 13 KB/s"
  function fmtPlain(v) {
    if (!isFinite(v) || v < 1024) return ['0.0', 'MB/s'];
    const mb = v / 1048576;
    if (mb >= 1) return [mb.toFixed(1), 'MB/s'];
    return [String(Math.round(v / 1024)), 'KB/s'];
  }

  function build(values) {
    const sm = values.map((v, i) => {
      const a = values[i - 1] ?? v;
      const b = values[i + 1] ?? v;
      return (a + v * 2 + b) / 4;
    });
    // 纵轴下限 64 KB/s：低速时不要把几 KB 的噪声放大成满屏山丘
    const max = Math.max(...sm, 65536) * 1.18;
    const pts = sm.map((v, i) => [
      (i / (sm.length - 1)) * W,
      H - 9 - (v / max) * (H - 26)
    ]);
    let d = `M${pts[0][0].toFixed(2)},${pts[0][1].toFixed(2)}`;
    for (let i = 1; i < pts.length - 1; i++) {
      const xc = (pts[i][0] + pts[i + 1][0]) / 2;
      const yc = (pts[i][1] + pts[i + 1][1]) / 2;
      d += ` Q${pts[i][0].toFixed(2)},${pts[i][1].toFixed(2)} ${xc.toFixed(2)},${yc.toFixed(2)}`;
    }
    const last = pts[pts.length - 1];
    d += ` L${last[0].toFixed(2)},${last[1].toFixed(2)}`;
    return { d, a: `${d} L${W},${H} L0,${H} Z` };
  }

  function paint() {
    if (Math.max(...hist) < 1024) {
      // 没有流量时不画蓝线，只留一条 0.6px 的发丝基线
      el.area.setAttribute('d', '');
      el.line.setAttribute('d', '');
      el.base.setAttribute('opacity', '1');
      return;
    }
    el.base.setAttribute('opacity', '0');
    const p = build(hist);
    el.area.setAttribute('d', p.a);
    el.line.setAttribute('d', p.d);
  }

  let last = performance.now();
  let lastRender = 0;
  let rafId = null;
  let animUntil = 0;

  function renderValues() {
    const d = Math.max(0, sDown.x);
    const u = Math.max(0, sUp.x);
    const [dv, du] = fmt(d);
    el.down.textContent = dv;
    el.unit.textContent = du;
    el.up.textContent = fmtPlain(u)[0];
    el.upUnit.textContent = fmtPlain(u)[1];
  }

  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    sDown.step(dt);
    sUp.step(dt);
    // 30fps 上限：数字动画不需要 60fps，渲染器省一半
    if (now - lastRender >= 30) {
      lastRender = now;
      renderValues();
    }

    const settled =
      Math.abs(sDown.x - sDown.t) < 1 && Math.abs(sDown.v) < 1 &&
      Math.abs(sUp.x - sUp.t) < 1 && Math.abs(sUp.v) < 1;
    if (settled || now >= animUntil) {
      sDown.x = sDown.t;
      sUp.x = sUp.t;
      renderValues();
      rafId = null;
      return;
    }
    rafId = requestAnimationFrame(frame);
  }

  // 只有变化超过 1% 才起动画；空闲时每秒直接改一次文字，不跑 rAF
  function kick() {
    if (rafId === null) {
      last = performance.now();
      rafId = requestAnimationFrame(frame);
      animUntil = last + 300;
    }
  }
  kick();

  let primaryId = null;
  let lockedNow = false;
  let connText = '已连接';
  let lastSample = null;

  function onSample(s) {
    lastSample = s;
    primaryId = s.primary_id;
    const primary = s.ifaces.find(i => i.id === s.primary_id);
    el.title.textContent = primary ? primary.alias : '无网络';
    connText = primary ? '已连接' : '无网络';
    el.state.textContent = lockedNow ? connText + ' · 已锁定' : connText;

    const wifi = s.ifaces.find(i => i.kind === 'wifi');
    if (!wifi) { el.wifi.textContent = '无'; el.wifi.className = 'off'; }
    else if (wifi.state === 'up') { el.wifi.textContent = '已连接'; el.wifi.className = ''; }
    else { el.wifi.textContent = '未连接'; el.wifi.className = 'off'; }

    hist.push(s.total_down); hist.shift();
    upHist.push(s.total_up); upHist.shift();
    paint();

    const changed = Math.abs(s.total_down - sDown.t) > Math.max(1024, sDown.t * 0.01);
    sDown.t = s.total_down;
    sUp.t = s.total_up;
    if (changed) {
      kick();
    } else {
      sDown.x = sDown.t;
      sUp.x = sUp.t;
      renderValues();
    }

    el.mDown.textContent = fmtPlain(s.total_down)[0];
    el.mUnit.textContent = fmtPlain(s.total_down)[1];
    el.mUp.textContent = fmtPlain(s.total_up)[0] + ' ' + fmtPlain(s.total_up)[1];

    el.peak.textContent = fmtPlain(Math.max(...hist))[0] + ' ' + fmtPlain(Math.max(...hist))[1];
    el.peakUp.textContent = fmtPlain(Math.max(...upHist))[0] + ' ' + fmtPlain(Math.max(...upHist))[1];
    el.link.textContent = primary && primary.link_mbps ? primary.link_mbps.toFixed(0) + ' Mbps' : '—';
  }

  document.querySelector('.mini').addEventListener('click', () => {
    if (window.__TAURI__?.core) window.__TAURI__.core.invoke('expand_temporarily');
  });

  function onProbe(p) {
    const via = p.via;
    let text, cls;
    if (via && via.ok) { text = Math.round(via.ms) + ' ms'; cls = ''; }
    else if (p.proxy && p.proxy.port) { text = '不通'; cls = 'err'; }
    else if (p.proxy && p.proxy.accelerators && p.proxy.accelerators.length) {
      text = p.proxy.accelerators[0] + ' 未加速'; cls = '';
    } else { text = '未启用'; cls = 'warn'; }

    el.proxy.textContent = text;
    el.proxy.className = cls;

    const detail = (via && via.ok)
      ? text
      : (p.proxy && p.proxy.port) ? '不通'
      : (p.proxy && p.proxy.accelerators && p.proxy.accelerators.length) ? '未加速'
      : '未启用';
    el.proxy2.textContent = detail;
    el.proxy2.style.color = cls === 'err' ? '#FF3B30' : cls === 'warn' ? '#C46A00' : 'var(--s2)';

    if (p.direct && p.direct.ok) el.latency.textContent = Math.round(p.direct.ms) + ' ms';
    else el.latency.textContent = '—';
  }

  if (window.__TAURI__) {
    const card = document.getElementById('card');
    // 首帧就保持透明，等 app_ready 后的 net-mode 再淡入，避免冷启动硬闪
    card.classList.add('out');
    const enter = () => requestAnimationFrame(() => requestAnimationFrame(() => card.classList.remove('out')));
    // 双击卡片 = 手动收回顶部胶囊（拖动区默认的双击最大化已在 Rust 侧禁掉）
    // 自绘拖动：按下即跟随光标移动窗口（不再走 HTCAPTION，避免双击最大化）
    card.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      if (e.target.closest('.mini')) return;
      if (card.classList.contains('collapsed')) return;
      window.__TAURI__.core.invoke('begin_drag');
    });
    card.addEventListener('dblclick', (e) => {
      e.preventDefault();
      if (card.classList.contains('collapsed')) return;
      window.__TAURI__.core.invoke('collapse_to_island');
    });
    const setHot = (on) => {
      if (!card.classList.contains('collapsed')) return;
      if (on === card.classList.contains('hot')) return;
      card.classList.toggle('hot', on);
      window.__TAURI__.core.invoke('island_hover', { hot: on });
    };
    card.addEventListener('pointerenter', () => setHot(true));
    card.addEventListener('pointerleave', () => {
      if (!card.classList.contains('hot')) return;
      card.classList.remove('hot');
      window.__TAURI__.core.invoke('island_hover', { hot: false });
    });
    window.__TAURI__.event.listen('net-sample', e => onSample(e.payload));
    window.__TAURI__.event.listen('net-probe', e => onProbe(e.payload));
    window.__TAURI__.event.listen('net-leave', () => {
      card.classList.remove('hot');
      card.classList.add('out');
    });
    // 形变开始：切换目标布局、隐藏所有文字，窗口矩形交给 Rust 弹簧
    window.__TAURI__.event.listen('net-morph', e => {
      const toIsland = e.payload === 'island';
      card.classList.toggle('collapsed', toIsland);
      card.classList.add('morphing');
      if (!toIsland) {
        card.classList.remove('hot');
        window.__TAURI__.core.invoke('island_hover', { hot: false });
      }
    });
    // 形变接近落点：把目标内容淡入（胶囊先退、卡片后进，中间只有形状）
    window.__TAURI__.event.listen('net-mode', e => {
      const toIsland = e.payload === 'island';
      card.classList.toggle('collapsed', toIsland);
      card.classList.remove('morphing');
      // 窗口是被移动到鼠标下方的：Chromium 会误判为 hover，
      // 先冻结 hover 样式，等鼠标真的动了再恢复。
      if (!toIsland) {
        card.classList.remove('hot');
        card.classList.add('nohover');
        window.addEventListener('pointermove', () => card.classList.remove('nohover'), { once: true });
      }
      enter();
    });
    window.__TAURI__.event.listen('net-lock', e => {
      lockedNow = !!e.payload;
      el.state.textContent = lockedNow ? connText + ' · 已锁定' : connText;
    });
    // 首帧画完再让窗口显示，避免启动黑框
    requestAnimationFrame(() => requestAnimationFrame(() => {
      setTimeout(() => window.__TAURI__.core.invoke('app_ready'), 40);
    }));
  } else {
    // 浏览器预览：没有后端时给出静态占位，避免看起来像坏了
    el.title.textContent = '浏览器预览';
    el.state.textContent = '无后端';
    el.down.textContent = '0.0';
    el.up.textContent = '0.0';
    el.peak.textContent = '—';
    el.peakUp.textContent = '—';
    el.link.textContent = '—';
    el.count.textContent = '—';
  }
})();
</script>
</body>
</html>
